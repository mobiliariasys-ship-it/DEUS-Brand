<script>

// Advanced matching: recupera los datos del cliente que index.html guardó al
// iniciar el pago. Con esto el evento Purchase se empareja con la persona real
// que vio el anuncio, mejorando la tasa de coincidencia con Meta.
var __match = null;
try { __match = JSON.parse(sessionStorage.getItem('deus-fb-match') || 'null'); } catch (e) {}
if (__match) fbq('init', '2086346891978245', __match);
else fbq('init', '2086346891978245');
fbq('track', 'PageView');
// Purchase del navegador: SOLO se dispara si el servidor confirma que esa orden
// corresponde a un pago realmente aprobado.
//
// Antes, el píxel disparaba Purchase con solo leer la URL: entrar directo a
// /success.html, recargarla o inventar el parámetro contaba una compra falsa.
// Ahora primero preguntamos a /orden/estado; recién si responde pagado:true
// disparamos. Esto NO puede subcontar ventas reales: la Conversions API del
// servidor (webhook = fuente de verdad) ya reporta cada compra a Meta con el
// MISMO event_id 'purchase-<orden>', así que si acá no llegara a disparar (p.
// ej. el webhook aún no procesa el pago), Meta igual cuenta la venta una vez.
// El píxel del navegador queda como refuerzo con mejor emparejamiento (cookies
// del navegador), deduplicado contra la CAPI por el event_id compartido.
(function(){
  var q = new URLSearchParams(location.search);
  var monto = parseInt(q.get('monto'), 10);
  // Referencia del pago según el medio: Flow/Webpay mandan 'orden';
  // Mercado Pago manda 'payment_id' o 'collection_id'.
  var ref = q.get('orden') || q.get('payment_id') || q.get('collection_id');
  var API = (window.DEUS_API_BASE || '').replace(/\/$/, '');

  function limpiar(){
    // Ya no hacen falta los datos de emparejamiento, y no queremos que una
    // visita futura reuse la identidad de otro cliente.
    try { sessionStorage.removeItem('deus-fb-match'); } catch (e) {}
  }

  // Sin referencia de pago no hay nada que verificar → nunca disparamos.
  if (!ref) { limpiar(); return; }

  // Guarda contra doble disparo si el cliente recarga la página de éxito.
  var yaClave = 'deus-purchase-' + ref;
  try { if (sessionStorage.getItem(yaClave)) { limpiar(); return; } } catch (e) {}

  function dispararPurchase(){
    try { sessionStorage.setItem(yaClave, '1'); } catch (e) {}
    var datos = { value: (monto > 0 ? monto : 0), currency: 'CLP', content_name: 'DEUS Band' };
    fbq('track', 'Purchase', datos, { eventID: 'purchase-' + ref });
    limpiar();
  }

  // Pregunta al servidor si el pago está confirmado. Reintenta unas pocas veces
  // por si el webhook del medio de pago todavía no terminó de procesar (carrera
  // normal entre el redirect del navegador y la confirmación server-to-server).
  var intentos = 0, MAX = 5;
  function verificar(){
    intentos++;
    fetch(API + '/orden/estado?ref=' + encodeURIComponent(ref), { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(data){
        if (data && data.pagado) { dispararPurchase(); return; }
        if (intentos < MAX) setTimeout(verificar, 2000); // ~10s de margen total
        else limpiar(); // sin confirmar: la CAPI del servidor cubre la venta
      })
      .catch(function(){
        if (intentos < MAX) setTimeout(verificar, 2000);
        else limpiar();
      });
  }
  verificar();
})();
</script>

<div class="card">
  <div class="icon">✓</div>
  <h1>Pago Exitoso</h1>
  <p>Tu DEUS Band está en camino.<br>Recibirás un correo con el detalle de tu pedido.</p>
  <a href="/">Volver al inicio</a>
</div>
<script>
// Correlación conducta→compra: al confirmarse el pago, mandamos qué acciones e
// hitos había hecho esta sesión (guardados en sessionStorage por index.html).
// El backend cruza esto con cuántos las hicieron → % que compró tras cada una.
(function(){
  try{
    if(sessionStorage.getItem('deus-conv-sent')) return; // 1 sola vez por sesión
    sessionStorage.setItem('deus-conv-sent','1');
    function esOwner(){ try{ return localStorage.getItem('deus-admin-self')==='true'||!!localStorage.getItem('deus-admin-key'); }catch(e){ return false; } }
    var acciones=[];
    for(var i=0;i<sessionStorage.length;i++){
      var k=sessionStorage.key(i);
      if(k && k.indexOf('deus-ev-')===0){ acciones.push(k.slice(8)); } // 'accion:girar', 'hito:precio', etc.
    }
    var q=new URLSearchParams(location.search);
    var orden=q.get('orden')||q.get('payment_id')||q.get('collection_id')||'';
    var base=(window.DEUS_API_BASE||'').replace(/\/$/,'');
    fetch(base+'/track/conversion',{method:'POST',headers:{'Content-Type':'application/json'},keepalive:true,body:JSON.stringify({acciones:acciones,orden:orden,esOwner:esOwner()})}).catch(function(){});
  }catch(e){}
})();
</script>
