// iniciar el pago. Con esto el evento Purchase se empareja con la persona real
// que vio el anuncio, mejorando la tasa de coincidencia con Meta.
// Vive en localStorage (index.html lo guarda envuelto en {d, ts}) para que
// sobreviva al redirect a la pasarela y a un cierre de pestaña.
var __match = null;
try {
  var __g = JSON.parse(localStorage.getItem('deus-fb-match') || 'null');
  if (__g && __g.d) __match = __g.d;

// El Purchase lo manda SOLO el servidor, por la Conversions API, desde el
// mismo bloque del webhook que envía el correo de "pago confirmado". Una orden
// pagada = un correo = un Purchase, con idempotencia por n° de orden.
//
// Antes el navegador mandaba además su propio Purchase desde acá. Se sacó
// porque su guarda anti-duplicado vivía en sessionStorage, que es POR PESTAÑA:
// las pasarelas suelen devolver al cliente en una pestaña nueva, y ahí la
// guarda simplemente no existía. Una misma venta emitía varios eventos y Meta
// terminaba contando más compras de las que realmente ocurrían.
//
// No se pierde cobertura: la CAPI dispara desde el webhook —aunque el cliente
// no vuelva al sitio, tenga bloqueador de anuncios o iOS le corte el rastreo—
// y ya viaja con fbp, fbc, IP y user agent del navegador (capturados cuando
// inicia el pago) más email, teléfono, nombre, comuna, región y RUT. El píxel
// no aportaba ningún dato que el servidor no tuviera.
(function(){
  var q = new URLSearchParams(location.search);
  // Referencia del pago según el medio: Flow/Webpay mandan 'orden';
  // Mercado Pago manda 'payment_id' o 'collection_id'.
  var ref = q.get('orden') || q.get('payment_id') || q.get('collection_id');
  // Llegó con referencia de pago: la compra terminó, así que los datos de
  // emparejamiento ya cumplieron su función. Se borran para no dejar la
  // identidad de un cliente guardada en un equipo compartido. Al que abandonó
  // el checkout NO le pasa por acá, y es justamente el que queremos reconocer
  // cuando vuelva.
  if (ref) { try { localStorage.removeItem('deus-fb-match'); } catch (e) {} }
})();

<script>
// Purchase para TikTok. A Meta la compra le llega SOLO desde el servidor
// (Conversions API); TikTok no tiene envío desde el servidor, así que lo manda
// el navegador, pero únicamente si /orden/estado confirma que la orden está
// pagada, y con el monto del servidor (nunca el de la URL).
// La guarda anti-duplicado va en localStorage —compartido entre pestañas— y no
// en sessionStorage, que es por pestaña: eso era lo que duplicaba compras en
// Meta cuando la pasarela devolvía al cliente en una pestaña nueva. Además el
// event_id 'purchase-<orden>' le permite a TikTok deduplicar.
(function(){
  var q = new URLSearchParams(location.search);
  var ref = q.get('orden') || q.get('payment_id') || q.get('collection_id');
  if (!ref || !window.ttq) return;
  var clave = 'deus-tt-purchase-' + ref;
  try { if (localStorage.getItem(clave)) return; } catch (e) {}
  var API = (window.DEUS_API_BASE || '').replace(/\/$/, '');
  var intentos = 0, MAX = 5;
  function verificar(){
    intentos++;
    fetch(API + '/orden/estado?ref=' + encodeURIComponent(ref), { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if (d && d.pagado) {
          try {
            if (localStorage.getItem(clave)) return;
            localStorage.setItem(clave, '1');
          } catch (e) {}
          var datos = { currency: 'CLP', content_type: 'product', content_name: 'DEUS Band' };
          if (d.monto > 0) datos.value = d.monto;
          ttq.track('Purchase', datos, { event_id: 'purchase-' + ref });
        } else if (intentos < MAX) setTimeout(verificar, 2000);
      })
      .catch(function(){ if (intentos < MAX) setTimeout(verificar, 2000); });
  }
  verificar();
})();
</script>

<div class="card">

  <h1>Pago Exitoso</h1>
  <p>Tu DEUS Band está en camino.<br>Recibirás un correo con el detalle de tu pedido.</p>
  <a href="/">Volver al inicio</a>
</div>
<script>
// Correlación conducta→compra: al confirmarse el pago, mandamos qué acciones e
// hitos había hecho esta sesión (guardados en sessionStorage por index.html).
// El backend cruza esto con cuántos las hicieron → % que compró tras cada una.
(function(){
  try{
    if(sessionStorage.getItem('deus-conv-sent')) return; // 1 sola vez por sesión
    sessionStorage.setItem('deus-conv-sent','1');
    function esOwner(){ try{ return localStorage.getItem('deus-admin-self')==='true'||!!localStorage.getItem('deus-admin-key'); }catch(e){ return false; } }
    var acciones=[];
    for(var i=0;i<sessionStorage.length;i++){
      var k=sessionStorage.key(i);
      if(k && k.indexOf('deus-ev-')===0){ acciones.push(k.slice(8)); } // 'accion:girar', 'hito:precio', etc.
    }
    var q=new URLSearchParams(location.search);
    var orden=q.get('orden')||q.get('payment_id')||q.get('collection_id')||'';
    var base=(window.DEUS_API_BASE||'').replace(/\/$/,'');
    fetch(base+'/track/conversion',{method:'POST',headers:{'Content-Type':'application/json'},keepalive:true,body:JSON.stringify({acciones:acciones,orden:orden,esOwner:esOwner()})}).catch(function(){});
  }catch(e){}
})();
</script>
