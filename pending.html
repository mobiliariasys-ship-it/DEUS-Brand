<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pago pendiente — DEUS Band</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#080808;font-family:'DM Sans',sans-serif;color:#f2f2f2;display:flex;align-items:center;justify-content:center;min-height:100vh;}
.card{text-align:center;max-width:480px;padding:60px 40px;}
.icon{font-size:4rem;margin-bottom:24px;}
h1{font-family:'Bebas Neue',sans-serif;font-size:3rem;letter-spacing:4px;margin-bottom:12px;}
p{color:#909090;font-size:.85rem;letter-spacing:1px;line-height:1.7;margin-bottom:32px;}
a{display:inline-block;padding:12px 32px;border:1px solid #e8e8e8;color:#f2f2f2;text-decoration:none;font-size:.65rem;letter-spacing:3px;text-transform:uppercase;transition:all .2s;}
a:hover{background:#e8e8e8;color:#080808;}
</style>
</head>
<body>
<div class="card">
  <div class="icon">⏳</div>
  <h1>Pago Pendiente</h1>
  <p>Tu pago está siendo procesado.<br>Te notificaremos por correo cuando se confirme.</p>
  <a href="/">Volver al inicio</a>
</div>
</body>
</html>
