<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Página no encontrada — DEUS Band</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:#121214;color:#e8e8e8;font-family:'DM Sans',sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:24px;
  }
  .code{
    font-family:'Bebas Neue',sans-serif;font-size:clamp(4.5rem,18vw,9rem);
    line-height:1;letter-spacing:6px;color:#fff;
  }
  h1{
    font-family:'Bebas Neue',sans-serif;font-size:clamp(1.4rem,5vw,2rem);
    letter-spacing:3px;margin-top:8px;font-weight:400;
  }
  p{color:#a4a4ae;font-size:.92rem;line-height:1.7;max-width:420px;margin:16px auto 0;}
  a.btn{
    display:inline-block;margin-top:32px;padding:15px 38px;
    background:#e8e8e8;color:#121214;text-decoration:none;
    font-weight:600;font-size:.8rem;letter-spacing:2px;text-transform:uppercase;
    border-radius:8px;transition:transform .2s,box-shadow .2s;
  }
  a.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,255,255,.15);}
</style>
</head>
<body>
  <div class="code">404</div>
  <h1>Esta página no existe</h1>
  <p>El enlace que seguiste no lleva a ninguna parte. Puede que la dirección esté mal escrita o que la página ya no esté disponible.</p>
  <a class="btn" href="/">Volver al inicio</a>
</body>
</html>
