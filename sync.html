<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DEUS · Sincronizar banda</title>
<style>
:root{--bg:#080808;--card:#131313;--border:#252525;--gold:#d9bf92;
      --verde:#69c46d;--amarillo:#e0b64a;--rojo:#e05a5a;--dim:#8f8f8f;}
*{box-sizing:border-box;}
body{margin:0;padding:22px 16px 70px;background:var(--bg);color:#e8e8e8;
     font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.45;}
.wrap{max-width:520px;margin:0 auto;}
h1{font-size:1.05rem;letter-spacing:2.5px;text-transform:uppercase;margin:0;color:#fff;}
.sub{color:var(--dim);font-size:.75rem;margin:4px 0 20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:16px;margin-bottom:13px;}
.card h2{font-size:.66rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:0 0 12px;font-weight:600;}
button{font-family:inherit;font-size:.88rem;font-weight:600;border-radius:8px;border:1px solid var(--border);
       background:#1d1d1d;color:#e8e8e8;padding:12px 16px;cursor:pointer;width:100%;}
button.primary{background:#fff;color:#000;border-color:#fff;padding:16px;font-size:.95rem;
               letter-spacing:1.5px;text-transform:uppercase;}
button:disabled{opacity:.35;cursor:not-allowed;}
input{width:100%;font-family:inherit;font-size:.85rem;background:#0a0a0a;color:#e8e8e8;
      border:1px solid var(--border);border-radius:8px;padding:11px;margin-bottom:8px;}
.fila{display:flex;gap:8px;flex-wrap:wrap;}
.fila>*{flex:1;min-width:120px;margin-bottom:0;}
.resultado{border-radius:11px;padding:18px;text-align:center;margin-bottom:13px;display:none;}
.resultado.verde{background:rgba(105,196,109,.1);border:1px solid rgba(105,196,109,.45);}
.resultado.amarilla{background:rgba(224,182,74,.1);border:1px solid rgba(224,182,74,.45);}
.resultado.roja{background:rgba(224,90,90,.1);border:1px solid rgba(224,90,90,.45);}
.resultado b{display:block;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums;}
.resultado.verde b{color:var(--verde);} .resultado.amarilla b{color:var(--amarillo);}
.resultado.roja b{color:var(--rojo);}
.resultado small{display:block;font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-top:6px;}
.resultado .msg{font-size:.85rem;margin-top:14px;line-height:1.5;}
.resultado .ses{font-size:.85rem;background:rgba(0,0,0,.3);border-radius:8px;padding:12px;margin-top:12px;line-height:1.45;}
.hint{font-size:.72rem;color:var(--dim);line-height:1.5;margin-top:9px;}
.aviso{font-size:.8rem;padding:11px 13px;border-radius:8px;margin-top:10px;}
.aviso.ok{background:rgba(105,196,109,.1);color:#a9dfab;}
.aviso.err{background:rgba(224,90,90,.11);color:#f3b3b3;}
.descargo{font-size:.68rem;color:#6e6e6e;line-height:1.5;margin-top:20px;padding-top:14px;border-top:1px solid #1a1a1a;}
</style>
</head>
<body>
<div class="wrap">

<h1>Sincronizar banda</h1>
<div class="sub" id="sub">Cargando…</div>

<div class="resultado" id="resultado">
  <b id="r-puntaje">--</b>
  <small id="r-zona"></small>
  <div class="msg" id="r-msg"></div>
  <div class="ses" id="r-ses"></div>
</div>

<div class="card">
  <h2>Desde la banda</h2>
  <button class="primary" id="btn-ble">Conectar banda</button>
  <div class="hint" id="hint-ble">
    Conectá la pulsera y se suben solos los días que tenga guardados.
    Necesita Chrome en Android — en iPhone no se puede por una restricción de Apple.
  </div>
  <div id="aviso-ble"></div>
</div>

<div class="card">
  <h2>A mano</h2>
  <div class="fila" style="margin-bottom:8px;">
    <input id="m-fecha" type="date">
    <input id="m-sueno" type="number" step="0.1" min="0" max="24" placeholder="Sueño (h)">
  </div>
  <div class="fila" style="margin-bottom:10px;">
    <input id="m-pulso" type="number" min="25" max="220" placeholder="Pulso en reposo">
    <input id="m-carga" type="number" min="0" max="2000" placeholder="Carga de ayer">
  </div>
  <button id="btn-manual">Enviar</button>
  <div class="hint">Los datos salen de la app Da Halo. El pulso en reposo es el más bajo de la noche.</div>
  <div id="aviso-manual"></div>
</div>

<div class="descargo" id="descargo"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const token = new URLSearchParams(location.search).get('t') || '';

function aviso(el, texto, ok) {
  $(el).innerHTML = texto ? `<div class="aviso ${ok ? 'ok' : 'err'}">${texto}</div>` : '';
}

function mostrarResultado(hoy) {
  if (!hoy || hoy.puntaje === null) return;
  const r = $('resultado');
  r.className = 'resultado ' + hoy.zona;
  r.style.display = 'block';
  $('r-puntaje').textContent = hoy.puntaje;
  $('r-zona').textContent = { verde: 'Podés exigirte', amarilla: 'Bajá un cambio', roja: 'Hoy toca recuperar' }[hoy.zona] || hoy.zona;
  $('r-msg').textContent = hoy.mensaje || '';
  $('r-ses').textContent = hoy.sesion || '';
  if (hoy.descargo) $('descargo').textContent = hoy.descargo;
}

async function enviar(dias) {
  const r = await fetch('/equipo/sync', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token, dias })
  });
  const c = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(c.error || `Error ${r.status}`);
  return c;
}

// ── Carga inicial ────────────────────────────────────────────────────────
(async function inicio() {
  $('m-fecha').value = new Date().toISOString().slice(0, 10);
  if (!token) {
    $('sub').textContent = 'Falta tu enlace personal. Pedíselo a tu entrenador.';
    $('btn-ble').disabled = $('btn-manual').disabled = true;
    return;
  }
  try {
    const r = await fetch('/equipo/mi-ficha?t=' + encodeURIComponent(token));
    const c = await r.json();
    if (!r.ok) throw new Error(c.error || 'No se pudo cargar tu ficha');
    $('sub').textContent = c.nombre;
    if (c.evaluacion) mostrarResultado(c.evaluacion);
    if (c.evaluacion && c.evaluacion.descargo) $('descargo').textContent = c.evaluacion.descargo;
  } catch (e) {
    $('sub').textContent = e.message;
    $('btn-ble').disabled = $('btn-manual').disabled = true;
  }

  if (!navigator.bluetooth) {
    $('btn-ble').disabled = true;
    $('hint-ble').innerHTML = '<b>Este navegador no puede conectar la banda.</b> '
      + 'Usá Chrome en Android. En iPhone no se puede por una restricción de Apple — '
      + 'mientras tanto, cargá los datos a mano acá abajo.';
  }
})();

// ── Bluetooth ────────────────────────────────────────────────────────────
// Protocolo de la DEUS Band, sacado leyendo la banda real (ver ble-test.html).
//
// La pulsera emite sola por fdd1 los contadores del día: tres enteros de 3
// bytes en little endian con pasos, metros y calorías. No hay que pedirle
// nada — apenas se conecta empieza a mandarlos.
//
// Sueño y pulso en reposo todavía no: viajan por comandos con el encabezado
// 'fd da 10 largo comando', que se está terminando de mapear. Cuando estén,
// se suman acá y el resto del flujo no cambia.
const SVC_DEUS  = '0000fdda-0000-1000-8000-00805f9b34fb';
const CHR_CONT  = '0000fdd1-0000-1000-8000-00805f9b34fb';
const SVC_BAT   = 0x180f;

const u24le = (dv, o) => dv.getUint8(o) | (dv.getUint8(o + 1) << 8) | (dv.getUint8(o + 2) << 16);

// Espera la próxima emisión de contadores. La banda las manda cada pocos
// segundos mientras hay movimiento; si está totalmente quieta puede tardar,
// por eso el aviso de que muevas la muñeca.
function esperarContadores(car, ms = 12000) {
  return new Promise((resolve, reject) => {
    const alSonar = ev => {
      const dv = ev.target.value;
      if (dv.byteLength < 9) return;
      car.removeEventListener('characteristicvaluechanged', alSonar);
      clearTimeout(reloj);
      resolve({ pasos: u24le(dv, 0), distancia: u24le(dv, 3), calorias: u24le(dv, 6) });
    };
    const reloj = setTimeout(() => {
      car.removeEventListener('characteristicvaluechanged', alSonar);
      reject(new Error('La banda no envió datos. Movés la muñeca y probá de nuevo.'));
    }, ms);
    car.addEventListener('characteristicvaluechanged', alSonar);
  });
}

async function leerBanda() {
  const dev = await navigator.bluetooth.requestDevice({
    acceptAllDevices: true,
    optionalServices: [SVC_DEUS, SVC_BAT]
  });
  aviso('aviso-ble', `Conectando con ${dev.name || 'la banda'}…`, true);
  await dev.gatt.connect();

  let svc;
  try {
    svc = await dev.gatt.getPrimaryService(SVC_DEUS);
  } catch (e) {
    dev.gatt.disconnect();
    throw new Error('Ese dispositivo no es una DEUS Band. Probá de nuevo y elegí la pulsera de la lista.');
  }

  const car = await svc.getCharacteristic(CHR_CONT);
  let contadores = null;

  // Primero se intenta leer directo; si no se puede, se espera a que emita.
  if (car.properties.read) {
    try {
      const dv = await car.readValue();
      if (dv.byteLength >= 9) {
        contadores = { pasos: u24le(dv, 0), distancia: u24le(dv, 3), calorias: u24le(dv, 6) };
      }
    } catch (e) { /* se sigue por notificaciones */ }
  }
  if (!contadores && (car.properties.notify || car.properties.indicate)) {
    aviso('aviso-ble', 'Conectado. Esperando datos — movés un poco la muñeca…', true);
    await car.startNotifications();
    contadores = await esperarContadores(car).finally(() => {
      try { dev.gatt.disconnect(); } catch (e) {}
    });
  }
  try { dev.gatt.disconnect(); } catch (e) {}
  if (!contadores) throw new Error('No se pudieron leer los contadores de la banda.');

  return [{ fecha: new Date().toISOString().slice(0, 10), origen: 'banda', ...contadores }];
}

$('btn-ble').onclick = async () => {
  aviso('aviso-ble', '', true);
  $('btn-ble').disabled = true;
  try {
    const dias = await leerBanda();
    const r = await enviar(dias);
    const c = dias[0];
    aviso('aviso-ble', `Listo: ${c.pasos.toLocaleString('es-CL')} pasos · `
      + `${(c.distancia / 1000).toFixed(2)} km · ${c.calorias} kcal.`
      + '<br><small>El sueño y el pulso en reposo todavía se cargan a mano — la banda '
      + 'los guarda, pero falta terminar de mapear cómo pedírselos.</small>', true);
    mostrarResultado(r.hoy);
  } catch (e) {
    aviso('aviso-ble', e.message, false);
  } finally { $('btn-ble').disabled = false; }
};

$('btn-manual').onclick = async () => {
  const dia = { fecha: $('m-fecha').value, origen: 'manual' };
  const num = v => (v === '' ? undefined : Number(v));
  dia.suenoHoras  = num($('m-sueno').value);
  dia.pulsoReposo = num($('m-pulso').value);
  dia.carga       = num($('m-carga').value);
  if (!dia.fecha) { aviso('aviso-manual', 'Elegí la fecha.', false); return; }
  if (dia.suenoHoras === undefined && dia.pulsoReposo === undefined && dia.carga === undefined) {
    aviso('aviso-manual', 'Cargá al menos un dato.', false); return;
  }
  try {
    const r = await enviar([dia]);
    aviso('aviso-manual', r.guardados ? 'Guardado.' : 'No se guardó: revisá los valores.', !!r.guardados);
    mostrarResultado(r.hoy);
  } catch (e) { aviso('aviso-manual', e.message, false); }
};
</script>
</body>
</html>
