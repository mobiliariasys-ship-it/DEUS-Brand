name: Sync to production

on:
  push:
    branches:
      - 'claude/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEUS-Brand (dev)
        uses: actions/checkout@v4
        with:
          path: dev-repo

      - name: Checkout DEUS-BAND (production)
        uses: actions/checkout@v4
        with:
          repository: mobiliariasys-ship-it/DEUS-BAND
          ref: main
          token: ${{ secrets.PROD_REPO_TOKEN }}
          path: prod-repo

      - name: Copy synced files
        run: |
          # Sincroniza TODO el sitio (HTML, JS del backend, imágenes, etc.),
          # no solo 3 archivos. Sin esto, cada imagen/asset nuevo quedaba fuera
          # de producción y no cargaba en la web. Se excluye lo que no debe
          # viajar: git, workflows y dependencias.
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='node_modules' \
            dev-repo/ prod-repo/

      - name: Commit and push if changed
        working-directory: prod-repo
        run: |
          git config user.name "deus-sync-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync"
            exit 0
          fi
          git commit -m "sync: auto-sync desde DEUS-Brand ${{ github.ref_name }} (${{ github.sha }})"
          git push origin main
